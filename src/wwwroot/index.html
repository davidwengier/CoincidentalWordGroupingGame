<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coincidental Word Grouping Game</title>
    <base href="/" />
    <script>
        (() => {
            const storageKey = "theme";
            const darkTheme = "dark";
            const lightTheme = "light";
            const storedTheme = localStorage.getItem(storageKey);
            const theme =
                storedTheme === darkTheme || storedTheme === lightTheme
                    ? storedTheme
                    : (window.matchMedia("(prefers-color-scheme: dark)").matches ? darkTheme : lightTheme);

            document.documentElement.dataset.theme = theme;
            document.documentElement.style.colorScheme = theme;
        })();
    </script>
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link href="CoincidentalWordGroupingGame.styles.css" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app"></div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
