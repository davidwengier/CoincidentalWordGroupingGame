name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Publish app
        run: dotnet publish src/CoincidentalWordGroupingGame.csproj --configuration Release --output publish

      - name: Prepare Pages artifact
        shell: pwsh
        run: |
          $siteDir = Join-Path $PWD 'publish/wwwroot'
          $basePath = '${{ steps.pages.outputs.base_path }}'
          $baseHref = if ([string]::IsNullOrWhiteSpace($basePath) -or $basePath -eq '/') { '/' } else { "$basePath/" }
          $indexPath = Join-Path $siteDir 'index.html'
          $index = (Get-Content $indexPath -Raw).Replace('<base href="/" />', ('<base href="{0}" />' -f $baseHref))
          Set-Content -Path $indexPath -Value $index -NoNewline
          Copy-Item $indexPath (Join-Path $siteDir '404.html')
          New-Item -Path (Join-Path $siteDir '.nojekyll') -ItemType File -Force | Out-Null

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
